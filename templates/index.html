<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fake News Detector</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b0b12; color:#fff; display:flex; justify-content:center; padding:40px; }
    .card { background:#111; padding:20px; border-radius:8px; width:700px; box-shadow:0 6px 20px rgba(0,0,0,0.6); }
    textarea { width:100%; height:160px; padding:10px; border-radius:6px; border:1px solid #333; background:#08080a; color:#fff; }
    button { padding:10px 18px; border:none; border-radius:6px; cursor:pointer; background:#2ecc71; color:#000; font-weight:700; }
    .result { margin-top:15px; font-size:18px; padding:12px; border-radius:6px; }
    .real { background: #1d7a1d; color:#fff; }
    .fake { background: #7a1d1d; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fake News Detector</h2>
    <form method="post">
      <label>Paste news headline / article:</label><br><br>
      <textarea name="news" placeholder="Paste news text here..."></textarea><br><br>
      <button type="submit">Check</button>
    </form>

    {% if result %}
      <div class="result {{ 'real' if result=='REAL' else 'fake' }}">
        Result: <strong>{{ result }}</strong>
        {% if prob %}
        &nbsp; | Confidence: {{ prob }}
        {% endif %}
      </div>
    {% endif %}
    <p style="font-size:12px; color:#aaa; margin-top:12px;">Model: TF-IDF + Logistic Regression (baseline)</p>
  </div>
</body>
</html>
